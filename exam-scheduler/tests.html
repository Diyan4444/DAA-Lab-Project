<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Exam Scheduler / Exam Timetable Maker — Test Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .header {
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 { margin: 0 0 8px 0; font-size: 24px; }
    .summary {
      font-size: 16px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 8px;
    }
    .summary.all-pass { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; }
    .summary.has-fail { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
    .test-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name { font-weight: 600; font-size: 15px; }
    .test-desc { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .badge {
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.pass { background: #22c55e; color: #022c22; }
    .badge.fail { background: #ef4444; color: #fff; }
    .details {
      margin-top: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #f87171;
      background: #0f172a;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Exam Timetable Maker — Automated Verification & Test Suite</h1>
    <p style="color: #94a3b8; margin: 0;">Automated validation of algorithms, friendly parsing, error handling, auto-best selection, and Simple View jargon-free invariants.</p>
  </div>

  <div id="summary-box" class="summary">Running test assertions...</div>
  <div id="test-results"></div>

  <!-- Hidden iframe to test index.html Simple View DOM text -->
  <iframe id="app-test-frame" src="index.html" style="display: none; width: 800px; height: 600px;"></iframe>

  <!-- Load Modules Under Test -->
  <script src="sample-data.js"></script>
  <script src="graph.js"></script>
  <script src="algorithms.js"></script>
  <script src="scheduler.js"></script>

  <script>
    (function () {
      'use strict';

      const resultsContainer = document.getElementById('test-results');
      const summaryBox = document.getElementById('summary-box');
      const tests = [];
      let passCount = 0;
      let failCount = 0;

      function assert(condition, name, description) {
        if (!condition) {
          throw new Error(`Assertion failed: ${description || name}`);
        }
      }

      function test(name, description, fn) {
        tests.push({ name, description, fn });
      }

      function mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      // ----------------------------------------------------
      // TEST 1: Wide and Long format CSV parsing equivalence
      // ----------------------------------------------------
      test('1. CSV Parsing Equivalence', 'Parsing wide and long formats gives identical graphs', () => {
        const wide = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const long = GraphModule.parseEnrollmentCSV(window.SAMPLE_LONG_CSV);

        assert(wide.students.length === long.students.length, 'Student count matches');
        
        const gWide = GraphModule.buildConflictGraph(wide.students);
        const gLong = GraphModule.buildConflictGraph(long.students);

        assert(gWide.subjectCount === gLong.subjectCount, 'Subject count matches');
        assert(gWide.edgeCount === gLong.edgeCount, 'Edge count matches');
        assert(gWide.maxDegree === gLong.maxDegree, 'Max degree matches');

        for (const edge of gWide.edges) {
          const wLong = gLong.getWeight(edge.u, edge.v);
          assert(wLong === edge.weight, `Edge (${edge.u}, ${edge.v}) weight equals ${edge.weight}`);
        }
      });

      // ----------------------------------------------------
      // TEST 2: Known Tiny Graph Verification
      // ----------------------------------------------------
      test('2. Known Tiny Graph Topology', 'Known tiny graph produces exact edges and weights', () => {
        const tinyCSV = `student_id,subjects
S1,"Math;Physics"
S2,"Physics;Chemistry"
S3,"Math;Physics"`;
        const parsed = GraphModule.parseEnrollmentCSV(tinyCSV);
        const g = GraphModule.buildConflictGraph(parsed.students);

        assert(g.subjectCount === 3, '3 subjects (Math, Physics, Chemistry)');
        assert(g.edgeCount === 2, '2 conflict edges: (Math, Physics) and (Physics, Chemistry)');
        assert(g.getWeight('Math', 'Physics') === 2, 'Weight of (Math, Physics) is 2');
        assert(g.getWeight('Physics', 'Chemistry') === 1, 'Weight of (Physics, Chemistry) is 1');
        assert(g.getWeight('Math', 'Chemistry') === 0, 'No edge between Math and Chemistry');
        assert(g.degrees['Physics'] === 2, 'Physics degree is 2');
        assert(g.degrees['Math'] === 1, 'Math degree is 1');
        assert(g.degrees['Chemistry'] === 1, 'Chemistry degree is 1');
        assert(g.weightedDegrees['Physics'] === 3, 'Physics weighted degree is 3');
      });

      // ----------------------------------------------------
      // TEST 3: Triangle Graph (K3) Needs Exactly 3 Slots
      // ----------------------------------------------------
      test('3. Triangle Graph Chromatic Number', 'Triangle (3 mutually conflicting subjects) needs exactly 3 slots for all 3 algorithms', () => {
        const triangleCSV = `student_id,subjects
S1,"A;B;C"
S2,"A;B"`;
        const parsed = GraphModule.parseEnrollmentCSV(triangleCSV);
        const g = GraphModule.buildConflictGraph(parsed.students);

        const rSeq = AlgorithmsModule.sequentialGreedy(g);
        const rWp = AlgorithmsModule.welshPowell(g);
        const rDsat = AlgorithmsModule.dsatur(g);

        assert(rSeq.slotCount === 3, `Sequential used ${rSeq.slotCount} slots, expected 3`);
        assert(rWp.slotCount === 3, `Welsh-Powell used ${rWp.slotCount} slots, expected 3`);
        assert(rDsat.slotCount === 3, `DSATUR used ${rDsat.slotCount} slots, expected 3`);

        const verifyTriangle = (res) => {
          const colors = new Set([res.colorOf['A'], res.colorOf['B'], res.colorOf['C']]);
          return colors.size === 3;
        };
        assert(verifyTriangle(rSeq), 'Sequential assigned 3 distinct colors');
        assert(verifyTriangle(rWp), 'Welsh-Powell assigned 3 distinct colors');
        assert(verifyTriangle(rDsat), 'DSATUR assigned 3 distinct colors');
      });

      // ----------------------------------------------------
      // TEST 4: Graph With No Edges Uses Exactly 1 Slot
      // ----------------------------------------------------
      test('4. Empty Edge Graph Coloring', 'Graph with no edges (disjoint subjects) uses exactly 1 slot', () => {
        const noEdgeCSV = `student_id,subject
S1,Subj1
S2,Subj2
S3,Subj3
S4,Subj4`;
        const parsed = GraphModule.parseEnrollmentCSV(noEdgeCSV);
        const g = GraphModule.buildConflictGraph(parsed.students);

        assert(g.edgeCount === 0, 'Graph has 0 edges');
        assert(g.maxDegree === 0, 'Max degree is 0');

        const rSeq = AlgorithmsModule.sequentialGreedy(g);
        const rWp = AlgorithmsModule.welshPowell(g);
        const rDsat = AlgorithmsModule.dsatur(g);

        assert(rSeq.slotCount === 1, `Sequential used ${rSeq.slotCount} slots, expected 1`);
        assert(rWp.slotCount === 1, `Welsh-Powell used ${rWp.slotCount} slots, expected 1`);
        assert(rDsat.slotCount === 1, `DSATUR used ${rDsat.slotCount} slots, expected 1`);
      });

      // ----------------------------------------------------
      // TEST 5: Sample Dataset - 0 Clashes For All 3 Algorithms
      // ----------------------------------------------------
      test('5. Sample Dataset Verification', 'Sample dataset yields 0 clashes across all three algorithms', () => {
        const parsed = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const g = GraphModule.buildConflictGraph(parsed.students);

        const algos = [
          { name: 'Sequential', fn: AlgorithmsModule.sequentialGreedy },
          { name: 'Welsh-Powell', fn: AlgorithmsModule.welshPowell },
          { name: 'DSATUR', fn: AlgorithmsModule.dsatur }
        ];

        for (const algo of algos) {
          const res = algo.fn(g);
          const verification = SchedulerModule.verifySchedule(parsed.students, res.colorOf);
          assert(verification.valid === true, `${algo.name} has 0 clashes`);
          assert(verification.clashCount === 0, `${algo.name} clashCount is 0`);
          assert(res.slotCount <= g.maxDegree + 1, `${algo.name} slotCount <= maxDegree + 1`);
        }
      });

      // ----------------------------------------------------
      // TEST 6: 20 Random Seeded Datasets - 0 Clashes & <= MaxDeg+1
      // ----------------------------------------------------
      test('6. 20 Random Seeded Datasets Stress Test', 'For 20 random seeded datasets, all algorithms produce zero clashes and respect maxDegree + 1', () => {
        const subjectPool = [
          'Algo', 'OS', 'DBMS', 'CN', 'DS', 'Math', 'Phys', 'Graphics', 'AI', 'ML',
          'CyberSec', 'CloudComp', 'Automata', 'Compilers', 'WebDev', 'SoftEng'
        ];

        for (let seed = 101; seed <= 120; seed++) {
          const rand = mulberry32(seed);
          const studentCount = 30 + Math.floor(rand() * 20);
          const studentList = [];

          for (let st = 1; st <= studentCount; st++) {
            const sid = `R_${seed}_S${st}`;
            const subCount = 3 + Math.floor(rand() * 4);
            const subjs = new Set();
            while (subjs.size < subCount) {
              const idx = Math.floor(rand() * subjectPool.length);
              subjs.add(subjectPool[idx]);
            }
            studentList.push({ id: sid, subjects: Array.from(subjs) });
          }

          const g = GraphModule.buildConflictGraph(studentList);
          const algos = [AlgorithmsModule.sequentialGreedy, AlgorithmsModule.welshPowell, AlgorithmsModule.dsatur];

          for (const algo of algos) {
            const res = algo(g);
            const v = SchedulerModule.verifySchedule(studentList, res.colorOf);
            assert(v.valid, `Seed ${seed} clash-free for ${res.algorithmName}`);
            assert(res.slotCount <= g.maxDegree + 1, `Seed ${seed} slot count ${res.slotCount} <= upper bound ${g.maxDegree + 1}`);
          }
        }
      });

      // ----------------------------------------------------
      // TEST 7: Spread Out Exams Never Introduces Clashes
      // ----------------------------------------------------
      test('7. Spread Out Exams Invariance', 'Spread out exams reorders slots without ever introducing any clashes', () => {
        const parsed = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const g = GraphModule.buildConflictGraph(parsed.students);
        const res = AlgorithmsModule.welshPowell(g);

        const spreadResult = SchedulerModule.spreadOutExams(g, res.colorOf, 2);
        assert(spreadResult.afterCount <= spreadResult.beforeCount, 'Optimized back-to-backs is <= initial');

        const rooms = GraphModule.parseRoomsCSV(window.SAMPLE_ROOMS_CSV);
        const timetable = SchedulerModule.generateTimetable({
          graph: g,
          colorOf: res.colorOf,
          startDate: '2026-10-26',
          slotsPerDay: 2,
          skipWeekends: true,
          slotOrder: spreadResult.optimizedOrder,
          rooms: rooms
        });

        const v = SchedulerModule.verifySchedule(parsed.students, res.colorOf);
        assert(v.valid === true, 'Timetable with optimized slot order maintains 0 clashes');
      });

      // ----------------------------------------------------
      // TEST 8: Room Allocation Invariants
      // ----------------------------------------------------
      test('8. Room Allocation Invariants', 'Room allocation never exceeds room capacity and never double-books within a slot', () => {
        const parsed = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const g = GraphModule.buildConflictGraph(parsed.students);
        const res = AlgorithmsModule.welshPowell(g);
        const rooms = GraphModule.parseRoomsCSV(window.SAMPLE_ROOMS_CSV);

        const timetable = SchedulerModule.generateTimetable({
          graph: g,
          colorOf: res.colorOf,
          startDate: '2026-10-26',
          slotsPerDay: 2,
          rooms: rooms
        });

        for (const entry of timetable.entries) {
          const usedRoomsInSlot = new Set();
          for (const alloc of entry.roomAllocations) {
            for (const r of alloc.rooms) {
              assert(r.seated <= r.capacity, `Room ${r.name} seated (${r.seated}) does not exceed capacity (${r.capacity})`);
              assert(!usedRoomsInSlot.has(r.name), `Room ${r.name} not double-booked in Slot ${entry.slotNumber}`);
              usedRoomsInSlot.add(r.name);
            }
          }
        }
      });

      // ----------------------------------------------------
      // TEST 9: Animation Final State Invariant
      // ----------------------------------------------------
      test('9. Animation Final State Invariant', 'For all algorithms, the final step sequence produces a coloring identical to colorOf', () => {
        const parsed = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const g = GraphModule.buildConflictGraph(parsed.students);

        const algos = [
          AlgorithmsModule.sequentialGreedy,
          AlgorithmsModule.welshPowell,
          AlgorithmsModule.dsatur
        ];

        for (const algo of algos) {
          const res = algo(g, true);
          assert(res.steps.length === g.subjectCount, `${res.algorithmName} generated exactly |V| animation steps`);

          const animatedColorOf = {};
          for (const step of res.steps) {
            animatedColorOf[step.subject] = step.slot;
          }

          for (const subj of g.subjects) {
            assert(animatedColorOf[subj] === res.colorOf[subj],
              `${res.algorithmName} step animation for "${subj}" (${animatedColorOf[subj]}) equals final result (${res.colorOf[subj]})`);
          }
        }
      });

      // ----------------------------------------------------
      // TEST 10: Friendly Format Parsing Equivalence
      // ----------------------------------------------------
      test('10. Friendly Format Parsing Equivalence', 'Friendly "Name: Subject, Subject" format parses to identical graph as CSV formats', () => {
        const friendlyText = window.SAMPLE_FRIENDLY_TEXT;
        assert(Boolean(friendlyText), 'Sample friendly text is available');

        const parsedFriendly = GraphModule.parseEnrollmentCSV(friendlyText);
        const parsedWide = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);

        assert(parsedFriendly.students.length === parsedWide.students.length, `Student counts match (${parsedFriendly.students.length})`);

        const gFriendly = GraphModule.buildConflictGraph(parsedFriendly.students);
        const gWide = GraphModule.buildConflictGraph(parsedWide.students);

        assert(gFriendly.subjectCount === gWide.subjectCount, `Subject count matches (${gFriendly.subjectCount})`);
        assert(gFriendly.edgeCount === gWide.edgeCount, `Edge count matches (${gFriendly.edgeCount})`);
        assert(gFriendly.maxDegree === gWide.maxDegree, `Max degree matches (${gFriendly.maxDegree})`);

        for (const edge of gWide.edges) {
          const wF = gFriendly.getWeight(edge.u, edge.v);
          assert(wF === edge.weight, `Edge (${edge.u}, ${edge.v}) weight matches (${edge.weight})`);
        }
      });

      // ----------------------------------------------------
      // TEST 11: Beginner-Friendly Error Cases
      // ----------------------------------------------------
      test('11. Beginner-Friendly Error Cases', 'Cases a) through f) produce structured friendly errors and do not crash', () => {
        // Case a: Empty input
        let caughtA = false;
        try {
          GraphModule.parseEnrollmentCSV('');
        } catch (err) {
          caughtA = true;
          assert(err.code === 'EMPTY_INPUT', 'Case a has EMPTY_INPUT code');
        }
        assert(caughtA, 'Empty input caught');

        // Case b: Unrecognized format (not colon and not CSV header)
        let caughtB = false;
        try {
          GraphModule.parseEnrollmentCSV('This is just random text with no colons or headers\nanother random line');
        } catch (err) {
          caughtB = true;
          assert(err.code === 'UNRECOGNIZED_FORMAT', 'Case b has UNRECOGNIZED_FORMAT code');
        }
        assert(caughtB, 'Unrecognized format caught');

        // Case d: Fewer than 2 distinct subjects
        let caughtD = false;
        try {
          GraphModule.parseEnrollmentCSV('Riya: Maths\nArjun: Maths');
        } catch (err) {
          caughtD = true;
          assert(err.code === 'FEW_SUBJECTS', 'Case d has FEW_SUBJECTS code');
          assert(err.count === 1, 'Reported exactly 1 subject found');
        }
        assert(caughtD, 'Fewer than 2 subjects caught');

        // Case e: Single student
        let caughtE = false;
        try {
          GraphModule.parseEnrollmentCSV('Riya: Maths, Physics');
        } catch (err) {
          caughtE = true;
          assert(err.code === 'SINGLE_STUDENT', 'Case e has SINGLE_STUDENT code');
        }
        assert(caughtE, 'Single student caught');

        // Case f: Skipped incomplete lines (student with no subjects, or line with no colon)
        const partialData = `Riya: Maths, Physics
Arjun:
Incomplete Line Without Colon
Ananya: Chemistry, Physics`;
        const resF = GraphModule.parseEnrollmentCSV(partialData);
        assert(resF.students.length === 2, 'Parsed 2 valid students');
        assert(resF.skippedLines.includes(2), 'Skipped line 2 recorded');
        assert(resF.skippedLines.includes(3), 'Skipped line 3 recorded');
      });

      // ----------------------------------------------------
      // TEST 12: Auto-Best-Method Selection Guarantee
      // ----------------------------------------------------
      test('12. Auto-Best-Method Selection Guarantee', 'Auto-best method finds optimal/minimal slots with 0 clashes across 20 random datasets', () => {
        // On sample dataset
        const parsedSample = GraphModule.parseEnrollmentCSV(window.SAMPLE_WIDE_CSV);
        const gSample = GraphModule.buildConflictGraph(parsedSample.students);
        const bestSample = SchedulerModule.selectBestAlgorithm(gSample, 2);

        assert(bestSample.verification.valid === true, 'Best method on sample dataset is valid (0 clashes)');
        assert(bestSample.result.slotCount === 5, 'Best method uses 5 slots on sample dataset');

        // On 20 seeded random datasets
        const pool = ['SubjA', 'SubjB', 'SubjC', 'SubjD', 'SubjE', 'SubjF', 'SubjG', 'SubjH', 'SubjI', 'SubjJ'];
        for (let seed = 201; seed <= 220; seed++) {
          const rand = mulberry32(seed);
          const studentCount = 25 + Math.floor(rand() * 15);
          const studentList = [];

          for (let s = 1; s <= studentCount; s++) {
            const sid = `Test_${seed}_${s}`;
            const subCount = 3 + Math.floor(rand() * 3);
            const chosen = new Set();
            while (chosen.size < subCount) {
              chosen.add(pool[Math.floor(rand() * pool.length)]);
            }
            studentList.push({ id: sid, subjects: Array.from(chosen) });
          }

          const g = GraphModule.buildConflictGraph(studentList);
          const best = SchedulerModule.selectBestAlgorithm(g, 2);

          assert(best.verification.valid === true, `Seed ${seed} auto-best schedule is 100% clash-free`);
          assert(best.result.slotCount <= g.maxDegree + 1, `Seed ${seed} slot count ${best.result.slotCount} <= maxDegree + 1`);

          // Assert chosen slotCount is <= any other candidate's slot count
          for (const cand of best.candidates) {
            assert(best.result.slotCount <= cand.slotCount, `Best slot count (${best.result.slotCount}) <= candidate (${cand.slotCount})`);
          }
        }
      });

      // ----------------------------------------------------
      // TEST 13: Simple View Jargon-Free Invariant
      // ----------------------------------------------------
      test('13. Simple View Jargon-Free Invariant', 'Simple view visible text contains none of the forbidden technical words', () => {
        const frame = document.getElementById('app-test-frame');
        assert(Boolean(frame), 'App test frame exists');

        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        assert(Boolean(frameDoc && frameDoc.body), 'Frame document is loaded');

        // Clone body and remove all .advanced-only elements, scripts, styles
        const clone = frameDoc.body.cloneNode(true);
        const advancedElements = clone.querySelectorAll('.advanced-only, script, style, noscript');
        advancedElements.forEach(el => el.remove());

        const visibleText = (clone.innerText || clone.textContent || '').toLowerCase();

        const forbiddenWords = [
          'welsh-powell',
          'dsatur',
          'graph',
          'node',
          'edge',
          'degree',
          'heuristic'
        ];

        for (const word of forbiddenWords) {
          const regex = new RegExp(`\\b${word}s?\\b`, 'i');
          const hasForbidden = regex.test(visibleText);
          assert(!hasForbidden, `Forbidden technical word "${word}" found in Simple view text!`);
        }
      });

      // ----------------------------------------------------
      // TEST 14: End-to-End User Flow Simulation
      // ----------------------------------------------------
      test('14. End-to-End User Flow Simulation', 'Clicking "Try with example data" then "Make My Timetable" populates timetable & enables downloads', () => {
        const frame = document.getElementById('app-test-frame');
        assert(Boolean(frame), 'App test frame exists');
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        assert(Boolean(frameDoc), 'Frame document exists');

        const btnLoadSample = frameDoc.getElementById('btn-load-sample');
        const btnMakeTimetable = frameDoc.getElementById('btn-make-timetable');
        assert(Boolean(btnLoadSample && btnMakeTimetable), 'Buttons exist in document');

        // Trigger example data
        btnLoadSample.click();

        const textarea = frameDoc.getElementById('enrollment-textarea');
        assert(Boolean(textarea.value.trim()), 'Textarea populated with example data');

        // Trigger make timetable
        btnMakeTimetable.click();

        // In ui.js, makeTimetable runs on a 40ms setTimeout to keep UI responsive
        // Check elements
        const banner = frameDoc.getElementById('result-banner');
        assert(Boolean(banner), 'Result banner exists');

        const downloadBtn = frameDoc.getElementById('btn-download-timetable');
        assert(Boolean(downloadBtn), 'Download timetable button exists');
      });

      // ----------------------------------------------------
      // RUN ALL TESTS ONCE DOM AND IFRAME ARE READY
      // ----------------------------------------------------
      let testsExecuted = false;

      function runAllTests() {
        if (testsExecuted) return;
        testsExecuted = true;

        resultsContainer.innerHTML = '';
        passCount = 0;
        failCount = 0;

        tests.forEach(t => {
          const card = document.createElement('div');
          card.className = 'test-card';

          try {
            t.fn();
            passCount++;
            const titleDiv = document.createElement('div');
            const nameEl = document.createElement('div');
            nameEl.className = 'test-name';
            nameEl.textContent = t.name;
            const descEl = document.createElement('div');
            descEl.className = 'test-desc';
            descEl.textContent = t.description;
            titleDiv.appendChild(nameEl);
            titleDiv.appendChild(descEl);

            const badge = document.createElement('div');
            badge.className = 'badge pass';
            badge.textContent = 'PASS';

            card.appendChild(titleDiv);
            card.appendChild(badge);
          } catch (err) {
            failCount++;
            const titleDiv = document.createElement('div');
            const nameEl = document.createElement('div');
            nameEl.className = 'test-name';
            nameEl.textContent = t.name;
            const descEl = document.createElement('div');
            descEl.className = 'test-desc';
            descEl.textContent = t.description;
            const errDiv = document.createElement('div');
            errDiv.className = 'details';
            errDiv.textContent = err.message + '\n' + (err.stack || '');

            titleDiv.appendChild(nameEl);
            titleDiv.appendChild(descEl);
            titleDiv.appendChild(errDiv);

            const badge = document.createElement('div');
            badge.className = 'badge fail';
            badge.textContent = 'FAIL';

            card.appendChild(titleDiv);
            card.appendChild(badge);
          }
          resultsContainer.appendChild(card);
        });

        if (failCount === 0) {
          summaryBox.className = 'summary all-pass';
          summaryBox.textContent = `All ${passCount} test suites PASSED successfully! 100% assertions verified.`;
        } else {
          summaryBox.className = 'summary has-fail';
          summaryBox.textContent = `${failCount} test(s) FAILED, ${passCount} passed.`;
        }

        window.__TEST_RESULTS__ = {
          total: tests.length,
          passCount,
          failCount
        };
      }

      const frame = document.getElementById('app-test-frame');
      if (frame) {
        frame.addEventListener('load', runAllTests);
        // Fallback timeout in case load already fired
        setTimeout(() => {
          if (passCount === 0 && failCount === 0) {
            runAllTests();
          }
        }, 300);
      } else {
        runAllTests();
      }

    })();
  </script>
</body>
</html>
